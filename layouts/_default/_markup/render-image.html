{{- $src := .Destination -}}
{{- $image := .Page.Resources.GetMatch $src -}}

{{- if $image -}}
    <img
        src="{{ $image.RelPermalink }}"
        alt="{{ .Text }}"
        {{- with .Title }} title="{{ . }}"{{ end -}}
    >
{{- else -}}
    <img
        src="{{ $src | relURL }}"
        alt="{{ .Text }}"
        {{- with .Title }} title="{{ . }}"{{ end -}}
    >
{{- end -}}
