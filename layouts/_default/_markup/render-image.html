{{- $src := .Destination -}}

{{- if not (or
    (strings.HasPrefix $src "http://")
    (strings.HasPrefix $src "https://")
    (strings.HasPrefix $src "//")
    (strings.HasPrefix $src "data:")
) -}}
    {{- $src = $src | relURL -}}
{{- end -}}

<img src="{{ $src }}" alt="{{ .Text }}"
    {{- with .Title }} title="{{ . }}"{{ end -}}>
